name: Lint
# on: push
on: [repository_dispatch, workflow_dispatch]
jobs:
  lint_python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          apt install -y adduser base-files bash bash-completion command-not-found cron debconf distro-info-data e2fsprogs fuse3 gettext-base hdparm keyutils libattr1:amd64 libaudit-common libc-bin libc6:amd64 libmagic1:amd64 libmecab2:amd64 libncursesw6:amd64 libpam-runtime libpcre2-8-0:amd64 libpython3.13-stdlib:amd64 libsensors-config libtirpc-common locales login logrotate lsb-release ltrace mailcap man-db media-types multipath-tools nano ncurses-base netbase nftables openssl overlayroot procps python3-zope.interface python3.13 rsyslog screen sudo tar tzdata ucf unixodbc-common usb-modeswitch walinuxagent wget
          pip install gradio_client==1.11.0 imageio==2.37.0 lazy_loader==0.4 networkx==3.5 pydantic_core==2.33.2 pytz==2025.2 readme_renderer==44.0 tifffile==2025.6.11 tzdata==2025.2
      - name: Execute Tests
        run: |
          pip install .[cpu,cli,dev]
          mypy --install-types --non-interactive --ignore-missing-imports ./rembg
          bandit --recursive --skip B101,B104,B310,B311,B303,B110 --exclude ./rembg/_version.py ./rembg
          black --force-exclude rembg/_version.py --check --diff ./rembg
          flake8 ./rembg --count --ignore=B008,C901,E203,E266,E731,F401,F811,F841,W503,E501,E402 --show-source --statistics --exclude ./rembg/_version.py
          isort --check-only --profile black ./rembg
